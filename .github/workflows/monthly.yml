name: SINAPI Monthly Import

on:
  schedule:
    # Dia 5, 10 e 15 às 09:00 UTC (06:00 Brasília). Caixa publica entre dia 1-3.
    - cron: "0 9 5,10,15 * *"
  workflow_dispatch:
    inputs:
      mes:
        description: "Mês YYYY-MM (vazio = mês passado)"
        default: ""
      tipo:
        description: "REFERENCIA ou MANUTENCOES"
        default: "REFERENCIA"
        type: choice
        options: [REFERENCIA, MANUTENCOES]
      duplicata:
        description: "NAO_DESONERADO ou DESONERADO"
        default: "NAO_DESONERADO"
        type: choice
        options: [NAO_DESONERADO, DESONERADO]

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run importer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          MES_ARG=""
          [ -n "${{ github.event.inputs.mes }}" ] && MES_ARG="--mes ${{ github.event.inputs.mes }}"
          TIPO="${{ github.event.inputs.tipo || 'REFERENCIA' }}"
          DUPL="${{ github.event.inputs.duplicata || 'NAO_DESONERADO' }}"
          python src/importer.py --tipo "$TIPO" --duplicata "$DUPL" $MES_ARG

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Falha import SINAPI ${today}`,
              body: `Cron de importação SINAPI falhou em ${today}.\n\nLogs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["bug", "sinapi"],
            });
