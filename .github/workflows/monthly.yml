name: SINAPI Monthly Import

on:
  schedule:
    - cron: "0 9 5,10,15 * *"
  workflow_dispatch:
    inputs:
      mes:
        description: "Mês YYYY-MM (vazio = mês passado)"
        default: ""
      tipo:
        description: "REFERENCIA ou DESONERADO"
        default: "REFERENCIA"
        type: choice
        options: [REFERENCIA, DESONERADO]
      policy:
        description: "Policy de duplicatas: substituir ou manter"
        default: "substituir"
        type: choice
        options: [substituir, manter]

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run importer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          MES_ARG=""
          [ -n "${{ github.event.inputs.mes }}" ] && MES_ARG="--mes ${{ github.event.inputs.mes }}"
          TIPO="${{ github.event.inputs.tipo || 'REFERENCIA' }}"
          POL="${{ github.event.inputs.policy || 'substituir' }}"
          python src/importer.py --tipo "$TIPO" --policy "$POL" $MES_ARG
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Falha import SINAPI ${today}`,
              body: `Falhou em ${today}. Logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["bug", "sinapi"],
            });
