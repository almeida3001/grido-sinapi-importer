name: SINAPI Monthly Import


on:
  schedule:
    - cron: "0 9 5,10,15 * *"→ Runs at 09:00, on day 5, 10, and 15 of the month

  workflow_dispatch:
    inputs:
      mes:
        description: "Mês YYYY-MM (vazio = mês passado)"
        default: ""
      tipo:
        description: "REFERENCIA ou DESONERADO"
        default: "REFERENCIA"
        type: choice
        options: [REFERENCIA, DESONERADO]
      policy:
        description: "substituir ou manter"
        default: "substituir"
        type: choice
        options: [substituir, manter]


jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
