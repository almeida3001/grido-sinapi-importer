name: SINAPI Monthly Import

on:
  schedule:
    - cron: "0 9 5,10,15 * *"
  workflow_dispatch:
    inputs:
      mes:
        description: "Mês YYYY-MM (vazio = mês passado)"
        default: ""
      tipo:
        description: "REFERENCIA ou DESONERADO"
        default: "REFERENCIA"
        type: choice
        options: [REFERENCIA, DESONERADO]
      policy:
        description: "substituir ou manter"
        default: "substituir"
        type: choice
        options: [substituir, manter]

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compute target month
        id: month
        run: |
          if [ -n "${{ github.event.inputs.mes }}" ]; then
            YYYY=$(echo "${{ github.event.inputs.mes }}" | cut -d- -f1)
            MM=$(echo "${{ github.event.inputs.mes }}" | cut -d- -f2)
          else
            YYYY=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y)
            MM=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%m)
          fi
          echo "yyyy=$YYYY" >> $GITHUB_OUTPUT
          echo "mm=$MM" >> $GITHUB_OUTPUT
          echo "mes=$YYYY-$MM" >> $GITHUB_OUTPUT
      - name: Download SINAPI ZIP from Caixa
        env:
          YYYY: ${{ steps.month.outputs.yyyy }}
          MM: ${{ steps.month.outputs.mm }}
          TIPO: ${{ github.event.inputs.tipo || 'REFERENCIA' }}
        run: |
          mkdir -p downloads/${YYYY}_${MM}
          URL="https://www.caixa.gov.br/Downloads/sinapi-a-vista-composicoes/SINAPI_${TIPO}_${MM}_${YYYY}.zip"
          OUT="downloads/${YYYY}_${MM}/SINAPI_${TIPO}_${MM}_${YYYY}.zip"
          echo "Downloading $URL"
          curl -L --max-redirs 5 --retry 3 --retry-delay 5 -o "$OUT" \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0" \
            -H "Referer: https://www.caixa.gov.br/site/Paginas/downloads.aspx?grupo=37" \
            -H "Accept: application/zip,*/*" \
            "$URL"
          ls -lh "$OUT"
          file "$OUT"
      - name: Run importer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTOSINAPI_SKIP_DOWNLOAD: "true"
        run: |
          MES_ARG="--mes ${{ steps.month.outputs.mes }}"
          TIPO="${{ github.event.inputs.tipo || 'REFERENCIA' }}"
          POL="${{ github.event.inputs.policy || 'substituir' }}"
          ZIP="downloads/${{ steps.month.outputs.yyyy }}_${{ steps.month.outputs.mm }}/SINAPI_${TIPO}_${{ steps.month.outputs.mm }}_${{ steps.month.outputs.yyyy }}.zip"
          python src/importer.py --tipo "$TIPO" --policy "$POL" $MES_ARG --zip-local "$ZIP"
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: \`Falha import SINAPI \${today}\`,
                body: \`Falhou em \${today}. Logs: \${context.serverUrl}/\${context.repo.owner}/\${context.repo.repo}/actions/runs/\${context.runId}\`,
                labels: ["bug", "sinapi"],
              });
            } catch(e) { console.log('issue create skipped:', e.message); }
